name: Deploy timetable-extractor-bot

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  IMAGE_NAME: ghcr.io/jonasclick/timetable-extractor-bot
  CONTAINER_APP_NAME: timetable-extractor-bot
  RESOURCE_GROUP: prod-rg-timetable-extractor

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.IMAGE_NAME }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.TIMETABLEEXTRACTORBOT_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.TIMETABLEEXTRACTORBOT_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.TIMETABLEEXTRACTORBOT_AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to Azure Container Apps
        run: |
          az containerapp update \
            --name "$CONTAINER_APP_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --image "${IMAGE_NAME}:${GITHUB_SHA}" \
            --min-replicas 1 \
            --max-replicas 1 \
            --output none
